name: Update globals.csv

on:
  push:
    paths:
      - "**.bambda"
      - "scripts/build_globals_csv.py"
  workflow_dispatch:

jobs:
  update-globals:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pyyaml

      - name: Regenerate globals.csv
        run: python scripts/build_globals_csv.py

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add globals.csv
          if git diff --cached --quiet; then
            echo "globals.csv is already up to date"
          else
            git commit -m "chore: regenerate globals.csv from burpglobal metadata"
            git push
          fi
